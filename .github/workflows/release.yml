# Arena Edit — full Windows release build (Setup.exe + portable zip).
# Trigger: Actions tab -> release-windows-full -> Run workflow (or a v* tag).
#
# FFmpeg comes from vcpkg as the LGPL build (the port's `gpl` feature stays
# off by default; policy D-044: LGPL only). Qt6 comes from the same vcpkg.
# whisper.cpp is built from the vendored sources.
name: release-windows-full

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Windows x64 full product
    runs-on: windows-2022
    # Backstop: cold vcpkg (Qt+FFmpeg+gtest) is ~70 min; warm ~15, plus the
    # full-media build (whisper.cpp, FFmpeg link) and packaging.
    timeout-minutes: 120
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4

      # Inno Setup (iscc), CMake and Ninja ship with the runner image.
      # vcpkg binaries (qtbase/ffmpeg build products, content-addressed) are
      # cached across runs so re-runs skip the ~70 min source builds.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-bin-${{ runner.os }}-release

      # Prefer the image's pre-installed vcpkg (C:\vcpkg per
      # VCPKG_INSTALLATION_ROOT), fall back to a fresh clone + bootstrap.
      # Installs Qt6 (LGPL) and FFmpeg (LGPL default — gpl feature off).
      - name: Set up vcpkg (Qt6 + FFmpeg LGPL)
        shell: pwsh
        run: |
          $root = $null
          foreach ($cand in @("C:\vcpkg", "D:\vcpkg")) {
            if (Test-Path "$cand\vcpkg.exe") { $root = $cand; break }
          }
          if (-not $root) {
            git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg
            & .\vcpkg\bootstrap-vcpkg.bat
            $root = (Resolve-Path .\vcpkg).Path
          } else {
            Write-Host "Using pre-installed vcpkg at $root"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          & "$root\vcpkg.exe" install qtbase:x64-windows ffmpeg:x64-windows gtest:x64-windows

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-bin-${{ runner.os }}-release

      # Put MSVC (cl/link) on PATH for the following steps. The vcvars64
      # environment is exported via GITHUB_ENV (documented mechanism).
      - name: Set up MSVC (vcvars64)
        shell: pwsh
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { throw "Visual Studio with MSVC not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          # Export everything EXCEPT VCPKG*: vcvars64 sets VCPKG_ROOT to the
          # VS-bundled vcpkg, which must not clobber our C:\vcpkg.
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$" -and $matches[1] -notlike "VCPKG*") {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }
          Write-Host "MSVC environment imported from $vcvars"

      # One-command release pipeline: configure (vcpkg toolchain picked up
      # from VCPKG_ROOT) -> build -> ctest (113) -> selftest with real media
      # -> stage portable (DLL layout preserved) -> iscc installer -> zip.
      - name: Build full product
        shell: pwsh
        run: |
          $env:ARENA_SELFTEST_MEDIA = "$env:GITHUB_WORKSPACE\tests\fixtures\clip01.mp4"
          # The image's pre-installed vcpkg uses <root>\installed as its
          # default install root (not vcpkg_installed); detect which exists.
          $inst = if (Test-Path "$env:VCPKG_ROOT\installed\x64-windows") { "$env:VCPKG_ROOT\installed" } else { "$env:VCPKG_ROOT\vcpkg_installed" }
          # Runtime DLLs (Qt/FFmpeg) for ctest + selftest from the build tree.
          $env:PATH = "$inst\x64-windows\bin;$env:PATH"
          tools\release.ps1 -WithMedia -FfmpegDir "$inst\x64-windows"

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: arenaedit-windows-x86_64-full
          path: |
            dist\ArenaEdit-*-Setup.exe
            dist\ArenaEdit-*-portable-win64.zip
            dist\portable
