# Arena Edit — full Windows release (media + STT), run on GitHub.
#
# Trigger:
#   - "Actions" tab -> "release-windows-full" -> Run workflow (manual, recommended)
#   - automatically on version tags: git tag v0.1.0 && git push origin v0.1.0
#
# What it does: builds an LGPL FFmpeg via vcpkg, then runs tools/release.ps1
# -WithMedia (build -> all tests -> selftest with the real media fixture ->
# portable zip with "Run Arena Edit.bat" -> branded installer). The final
# artifacts (Setup.exe + portable zip) appear on the run page under
# "Artifacts" — download, done.
name: release-windows-full

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-full:
    name: Windows x64 full product
    runs-on: windows-2022
    env:
      ARENA_SELFTEST_MEDIA: "${{ github.workspace }}\\tests\\fixtures\\clip01.mp4"
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        uses: lukka/checkout-vcpkg@v5
        with:
          vcpkgGitCommitId: "auto"

      - name: Install Inno Setup + nasm
        run: choco install -y innosetup nasm --no-progress

      # LGPL FFmpeg (the vcpkg port's default features do not enable GPL
      # components — keeps the project's LGPL-only dependency policy).
      # This step takes ~15-25 minutes; the rest of the run is fast.
      - name: Build FFmpeg (LGPL) via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg ffmpeg build failed" }

      # Full product: import/decode/export/STT. Runs the complete test suite,
      # the headless selftest against the real media fixture, stages the
      # portable payload (with platforms\qwindows.dll structure +
      # "Run Arena Edit.bat"), builds the installer, and zips everything.
      - name: Release (build + test + stage + installer)
        shell: pwsh
        run: |
          $ffmpeg = "$env:VCPKG_ROOT\vcpkg_installed\x64-windows"
          & tools\release.ps1 -WithMedia -FfmpegDir $ffmpeg
          if ($LASTEXITCODE -ne 0) { throw "release.ps1 failed" }

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arenaedit-windows-x86_64-full
          path: |
            dist\ArenaEdit-*-Setup.exe
            dist\ArenaEdit-*-portable-win64.zip
            dist\portable
