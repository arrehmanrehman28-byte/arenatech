# Arena Edit — full Windows release build (Setup.exe + portable zip).
# Trigger: Actions tab -> release-windows-full -> Run workflow (or a v* tag).
#
# FFmpeg comes from vcpkg as the LGPL build (the port's `gpl` feature stays
# off by default; policy D-044: LGPL only). Qt6 comes from the same vcpkg.
# whisper.cpp is built from the vendored sources.
name: release-windows-full

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Windows x64 full product
    runs-on: windows-2022
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4

      # Inno Setup (iscc), CMake and Ninja ship with the runner image.
      # Prefer the image's pre-installed vcpkg (C:\vcpkg per
      # VCPKG_INSTALLATION_ROOT; binary cache may cover qtbase/ffmpeg), fall
      # back to a fresh clone + bootstrap. Installs Qt6 (LGPL) and FFmpeg
      # (LGPL default — gpl feature off).
      - name: Set up vcpkg (Qt6 + FFmpeg LGPL)
        shell: pwsh
        run: |
          $root = $null
          foreach ($cand in @("C:\vcpkg", "D:\vcpkg")) {
            if (Test-Path "$cand\vcpkg.exe") { $root = $cand; break }
          }
          if (-not $root) {
            git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg
            & .\vcpkg\bootstrap-vcpkg.bat
            $root = (Resolve-Path .\vcpkg).Path
          } else {
            Write-Host "Using pre-installed vcpkg at $root"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          & "$root\vcpkg.exe" install qtbase:x64-windows ffmpeg:x64-windows

      # Put MSVC (cl/link) on PATH for the following steps; `set` output is
      # picked up by Actions as step environment.
      - name: Set up MSVC (vcvars64)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"^C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          set

      # One-command release pipeline: configure (vcpkg toolchain picked up
      # from VCPKG_ROOT) -> build -> ctest (113) -> selftest with real media
      # -> stage portable (DLL layout preserved) -> iscc installer -> zip.
      - name: Build full product
        shell: pwsh
        run: |
          $env:ARENA_SELFTEST_MEDIA = "$env:GITHUB_WORKSPACE\tests\fixtures\clip01.mp4"
          tools\release.ps1 -WithMedia -FfmpegDir "$env:VCPKG_ROOT\vcpkg_installed\x64-windows"

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: arenaedit-windows-x86_64-full
          path: |
            dist\ArenaEdit-*-Setup.exe
            dist\ArenaEdit-*-portable-win64.zip
            dist\portable
