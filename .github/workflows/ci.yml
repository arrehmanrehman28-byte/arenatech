# Arena Edit — CI (GitHub Actions).
# Linux job: full build (official Qt apt repo + apt FFmpeg + vendored
# whisper.cpp), zero-warning gate, unit tests, selftest, benchmark.
# Windows job: core-configuration gate (MSVC + vcpkg Qt, no media) +
# packaging via tools/release.ps1. The full-media Windows release lives in
# .github/workflows/release.yml (manual or v* tag).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux:
    name: Linux build + tests + benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev googletest libgl1-mesa-dev \
            libfontconfig1-dev pkg-config gpg wget
          # The Ubuntu 24.04 base image ships Qt 6.4, below the project's
          # 6.5 minimum — install Qt >= 6.5 from the official Qt apt channel.
          wget -O /tmp/qt6.key https://packagecloud.io/qt/qt6/gpgkey
          sudo gpg --dearmor -o /usr/share/keyrings/qt6.gpg /tmp/qt6.key
          echo "deb [signed-by=/usr/share/keyrings/qt6.gpg] https://packagecloud.io/qt/qt6/ubuntu/ noble main" \
            | sudo tee /etc/apt/sources.list.d/qt6.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DARENA_BUILD_TESTS=ON -DARENA_ENABLE_FFMPEG=ON -DARENA_ENABLE_WHISPER=ON

      - name: Build
        run: cmake --build build 2>&1 | tee build.log
      - name: Zero-warning gate
        run: |
          if grep -E "warning:" build.log | grep -v "^$"; then
            echo "::error::Compiler warnings found (target: zero warnings)"
            exit 1
          fi
          echo "No compiler warnings."

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Headless selftest
        run: |
          QT_QPA_PLATFORM=offscreen \
          ARENA_SELFTEST_MEDIA="$GITHUB_WORKSPACE/tests/fixtures/clip01.mp4" \
          ./build/app/arenaedit --selftest

      - name: Benchmark
        run: bash tools/benchmark.sh

      - name: Keep benchmark log
        if: always()
        run: cp build/test_bench.log benchmark.txt 2>/dev/null || echo "no benchmark log" > benchmark.txt

      - name: Stage portable payload
        run: |
          mkdir -p dist/portable
          cp build/app/arenaedit dist/portable/
          cp -r assets dist/portable/assets
          cp -r i18n dist/portable/i18n

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arenaedit-linux-x86_64
          path: |
            dist/portable
            benchmark.txt

  windows:
    name: Windows build + package (core gate)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Official vcpkg (no third-party actions). Installs Qt 6 (LGPL) only —
      # this job is the fast core gate; the full-media build is release.yml.
      - name: Set up vcpkg + Qt
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg
          & .\vcpkg\bootstrap-vcpkg.bat
          $root = (Resolve-Path .\vcpkg).Path
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          & .\vcpkg\vcpkg.exe install qtbase:x64-windows

      # release.ps1 reads VCPKG_ROOT, wires the CMake toolchain, then runs:
      # configure -> build -> ctest (113) -> selftest -> stage portable ->
      # iscc installer -> zip.
      - name: Release (build + test + stage + installer)
        shell: pwsh
        run: tools\release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: arenaedit-windows-x86_64
          path: |
            dist\ArenaEdit-*-Setup.exe
            dist\ArenaEdit-*-portable-win64.zip
            dist\portable
