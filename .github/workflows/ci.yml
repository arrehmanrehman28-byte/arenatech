# Arena Edit — CI (GitHub Actions).
# Linux job: full build (FFmpeg via apt + vendored whisper.cpp), zero-warning
# gate, unit tests, selftest, benchmark, portable artifact.
# Windows job: core-configuration gate (MSVC + vcpkg Qt) + packaging. The
# full-media Windows build (FFmpeg prefix + whisper) runs via the release
# pipeline — it needs an FFmpeg dev prefix that GitHub's public runners do
# not ship (D-044); see tools/build.ps1 -WithMedia -FfmpegDir.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_with_media:
        description: "Build the full-media Windows release (requires ARENA_FFMPEG_DIR secret)"
        type: boolean
        default: false

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux:
    name: Linux build + tests + benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev qt6-l10n-tools \
            libgtest-dev googletest libgl1-mesa-dev libfontconfig1-dev \
            pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DARENA_BUILD_TESTS=ON -DARENA_ENABLE_FFMPEG=ON -DARENA_ENABLE_WHISPER=ON

      - name: Build
        run: cmake --build build 2>&1 | tee build.log
      - name: Zero-warning gate
        run: |
          if grep -E "warning:" build.log | grep -v "^$"; then
            echo "::error::Compiler warnings found (target: zero warnings)"
            exit 1
          fi
          echo "No compiler warnings."

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Headless selftest
        run: |
          QT_QPA_PLATFORM=offscreen \
          ARENA_SELFTEST_MEDIA="$GITHUB_WORKSPACE/tests/fixtures/clip01.mp4" \
          ./build/app/arenaedit --selftest

      - name: Benchmark
        run: bash tools/benchmark.sh

      - name: Keep benchmark log
        if: always()
        run: bash tools/benchmark.sh > benchmark.txt || true

      - name: Stage portable payload
        run: |
          mkdir -p dist/portable
          cp build/app/arenaedit dist/portable/
          cp -r assets dist/portable/assets
          cp -r i18n dist/portable/i18n

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arenaedit-linux-x86_64
          path: |
            dist/portable
            benchmark.txt

  windows:
    name: Windows build + package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        uses: lukka/checkout-vcpkg@v5
        with:
          vcpkgGitCommitId: "auto"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Core-configuration gate: always runs. The optional full-media build
      # (-WithMedia) needs an FFmpeg dev prefix (secret ARENA_FFMPEG_DIR).
      - name: Configure (Qt via vcpkg manifest)
        uses: lukka/run-cmake@v5
        with:
          configurePreset: "Ninja-Multi-Config"
          configureOptions: |
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows
            -DARENA_BUILD_TESTS=ON
            -DARENA_ENABLE_FFMPEG=OFF
            -DARENA_ENABLE_WHISPER=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Selftest
        run: .\build\app\Release\ArenaEdit.exe --selftest

      # One-command release: stage the portable payload (DLLs keep their
      # directory structure — platforms\qwindows.dll is load-bearing),
      # build the branded installer, zip the payload.
      - name: Release (stage + installer + zip)
        shell: pwsh
        run: tools\release.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: arenaedit-windows-x86_64
          path: |
            dist\ArenaEdit-*-Setup.exe
            dist\ArenaEdit-*-portable-win64.zip
            dist\portable
